# ============================================================
# Supabase Ping — Haftada bir çalışır, projeyi uykudan korur
# ============================================================
name: Supabase Ping

on:
  schedule:
    # Her Pazartesi 09:00 UTC (Türkiye 12:00)
    - cron: '0 9 * * 1'
  workflow_dispatch: # Manuel tetikleme

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase ping
        run: |
          echo "Supabase ping gönderiliyor..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/sections?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP Yanıt: $RESPONSE"
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Supabase aktif."
          else
            echo "⚠️ Beklenmedik yanıt: $RESPONSE"
            exit 1
          fi
